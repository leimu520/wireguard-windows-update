name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-amd64:
    name: windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # build-amd64.sh fetches its own Go, LLVM-mingw, ImageMagick, WireGuardNT,
      # make and the wireguard-tools sources, each verified against a sha256,
      # then assembles the resource section and compiles wg.exe. shell: bash on
      # a Windows runner is Git Bash, which is the environment the script was
      # written for.
      - name: Build
        shell: bash
        run: ./build-amd64.sh

      # The resource section is the part that fails silently if it is missing:
      # no manifest means the window falls back to the old common controls, and
      # no icon group means no tray icon at all. So check that it is really
      # there rather than trusting the build to have done it.
      - name: Verify the resources are in the executable
        shell: bash
        run: |
          python .github/check-resources.py

      - name: Build the MSI installer
        shell: bash
        run: ./installer/build-msi.sh

      # An MSI that does not open is worse than no MSI, because it fails on the
      # user's machine rather than here. Administrative install unpacks it
      # without registering anything, which is enough to prove it is readable
      # and that the executable inside is the one we just built.
      - name: Verify the MSI opens and carries the executable
        shell: pwsh
        run: |
          $msi = Get-ChildItem installer/dist/*.msi | Select-Object -First 1
          if (-not $msi) { throw "no MSI was produced" }
          Write-Output ("checking " + $msi.Name + " (" + $msi.Length + " bytes)")
          $extract = Join-Path $env:RUNNER_TEMP 'msi-extract'
          & msiexec.exe /a "$($msi.FullName)" /qn TARGETDIR="$extract"
          Start-Sleep -Seconds 8
          $exe = Join-Path $extract 'WireGuard\wireguard.exe'
          if (-not (Test-Path $exe)) { throw "the MSI did not unpack a wireguard.exe" }
          Write-Output ("wireguard.exe inside the MSI: " + (Get-Item $exe).Length + " bytes")
          Write-Output ("sha256: " + (Get-FileHash $exe).Hash)
          $wg = Join-Path $extract 'WireGuard\wg.exe'
          if (-not (Test-Path $wg)) { throw "the MSI did not unpack a wg.exe" }
          Write-Output ("wg.exe inside the MSI: " + (Get-Item $wg).Length + " bytes")

      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp amd64/wireguard.exe dist/
          cp amd64/wg.exe dist/
          cp install.bat dist/
          cp deploy-zhuanban.ps1 dist/
          cp README.md dist/
          cp docs/autoreconnect.md dist/
          cp installer/dist/*.msi dist/
          powershell -NoProfile -Command "Compress-Archive -Path dist/* -DestinationPath wireguard-zhuanban-amd64.zip -Force"
          ls -l wireguard-zhuanban-amd64.zip
          sha256sum wireguard-zhuanban-amd64.zip

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-zhuanban-amd64
          path: wireguard-zhuanban-amd64.zip
          if-no-files-found: error

      # A release asset can be fetched with a plain URL, which is what makes
      # "download the build" a one-liner rather than an API call with a token.
      - name: Publish to the rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view zhuanban-latest >/dev/null 2>&1 || \
            gh release create zhuanban-latest \
              --title "WireGuard 专版 — 最新构建" \
              --notes "由 GitHub Actions 从 master 自动构建。安装方式：解压后以管理员身份运行 deploy-zhuanban.ps1。详细说明见包内的 docs/autoreconnect.md。"
          gh release upload zhuanban-latest wireguard-zhuanban-amd64.zip --clobber
          gh release view zhuanban-latest --json assets --jq '.assets[] | .name + "  " + (.size|tostring) + " bytes"'
